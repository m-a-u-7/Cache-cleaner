# SysSweep APK builder — GitHub Actions workflow
# Place this file at: .github/workflows/build-apk.yml  (inside your GitHub repo)
# Then push any change (or press "Run workflow") — the APK appears under
# the run's "Artifacts" as SysSweep-debug-apk.
#
# Note: this project zip has no gradlew wrapper, so the workflow installs
# Gradle 9.3.1 itself (via gradle/actions/setup-gradle) and runs `gradle`
# instead of `./gradlew`. AGP 9.1.1 + Gradle 9.3.1 need JDK 17.

name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SysSweep-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
